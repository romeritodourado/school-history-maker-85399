<!DOCTYPE html>
<html>
<head>
  <title>Fix Auth Loop</title>
</head>
<body>
  <h1>Limpando autenticação...</h1>
  <script>
    console.log('🧹 Limpando tokens Supabase no localStorage...');
    
    // Limpa todos os tokens Supabase
    Object.keys(localStorage).forEach(key => {
      if (key.startsWith('sb-') || key.includes('supabase.auth')) {
        localStorage.removeItem(key);
        console.log(`Removido: ${key}`);
      }
    });
    
    sessionStorage.clear();
    console.log('🧹 sessionStorage limpo!');
    
    console.log('🔄 Redirecionando para o início...');
    setTimeout(() => {
      window.location.href = '/';
    }, 1000);
  </script>
</body>
</html>
